spring:
  datasource:
    url: ${CRM_DB_URL}
    username: ${CRM_DB_USER}
    password: ${CRM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

crm:
  jwt:
    secret: ${CRM_JWT_SECRET}
  cors:
    # Comma-separated origins of the deployed frontend,
    # e.g. https://crm-ui.pages.dev,https://crm.yourdomain.com
    allowed-origins: ${CRM_CORS_ORIGINS}

logging:
  level:
    root: INFO
    com.veyora: INFO
