spring:
  profiles:
    active: local
  application:
    name: crm
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082
  servlet:
    context-path: /crm

crm:
  jwt:
    # Override per environment; local default only.
    secret: local-dev-secret-change-me-0123456789abcdef
    expiry-minutes: 480
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: logs/crm.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
